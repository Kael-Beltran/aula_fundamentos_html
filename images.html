<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<style>
    body {
        background-color: rgb(1, 6, 56);
        font-family:"Cinzel Decorative";
        
    }

    h1 {
        color: rgb(239, 236, 236);
        font-size: 50px;
        
        
    }

    .texto {
        display: flex;
        justify-content: center;
        width: 100%;
        align-items: center;
    }

    .img_pequena {
        width: 30%;
        height: 200px;
        object-fit: cover;
    }

    img {
        border-radius: 15px;
      
    }

    .img-destaque {
       height: 400px;
       width: 100%;
       object-fit: cover;
      
    }

    .div-imagens {
       margin-top: 30px;
       border: 4px solid rgb(152, 152, 152);
       border-radius: 15px;
       display: flex;
       justify-content: space-around;
    }


</style>

<body>
    <div class="texto">
        <h1>Melhores Carros</h1>
    </div>
    
    <div class="div-imagem">
        <img class="img-destaque" src="F1.jpg" alt="Foto da Porsche 911">
    </div>

    <div class="div-imagens"> 
        <img class="img_pequena" src="F2.jpg" alt="Foto de uma Mitsubishi Eclipse do Brian">
        <img class="img_pequena" src="F3.jpg" alt="Foto de um Konigsegg Jesko">
        <img class="img_pequena" src="F4.jpg" alt="Foto de uma McLaren">
    </div>

</body>
</html>
