<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>

        /* Faz o reset da margin e padding dos elementos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-border-box;
        }

        body {
            background-color: rgb(73, 1, 1);
            font-family: "Cinzel Decorative", serif;
        }

        h1, p {
            padding: 20px;
        }

        h2 {
            padding: 10px;
        }

        .bio {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            margin: auto;
            text-align: center;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .bio img:not(.logos) {
            max-width: 30%;
            height: auto;
            border-radius: 20px; /* Borda arredondada para combinar com o container */
            object-fit: cover;
        }

        ul {
            list-style-type: none;
        }

        li {
            padding: 5px;
        }

        a {
            text-decoration: none;
        }

        .logos {
            width: 32px;
        }

    </style>
</head>

<body>

    <div class="bio">
        <h1>Olá, sou o Kael</h1>
        <img src="foto.png.jpg" alt="Minha foto">

        <p>
            Tenho 16 anos, sou aluno de Informática e desenvolvedor de
            sistemas e gosto de música e jogos.
        </p>

        <h2>Minhas Especialidades</h2>
        <ul>
    <a target="_blank" href="https://youtube.com/playlist?list=PLK4kjey2kdGfd66IEcLAGmd3iuhtTXuDb&si=Eie-M7aeLajaYigo">Fazer comidas</a><br>
    <a target="_blank" href="https://youtube.com/playlist?list=PLI_JLekVwq0Oru82B_zMnp8x62JqsqxTX&si=IYw_rqGrI9qUEv3n">Amassar em jogos online</a><br>
    <a target="_blank" href="https://youtube.com/playlist?list=PL4ho9kqU6OItsI2CAxWW3YIM3hVHGryO1&si=mFUEbwbhbj_kM0K2">Cuidar de Varios Animais</a>
        </ul>
        <br>

        <a href="https://github.com/Kael-Beltran" target="_blank">
            <img class="logos" src="GitHub.png" alt="GitHub">
        </a>

        &nbsp;&nbsp;

        <a href="https://www.linkedin.com/in/kael-andrade-beltran-da-silva-32ab93352/" target="_blank">
            <img class="logos" src="linkedin.png" alt="LinkedIn">
        </a>

    </div>

</body>

</html>
