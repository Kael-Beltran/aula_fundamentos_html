<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Melhores Carros · Galeria Profissional</title>
    <meta name="description" content="Galeria responsiva, acessível e elegante com uma seleção dos melhores carros. Design profissional e interação fluida.">
    <meta name="theme-color" content="#021038">

    <!-- Fonte premium -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">

    <style>
        /* ===== Reset & Variáveis ===== */
        :root {
            --bg: #010638;
            --card: #10142b;
            --border: #898989;
            --text: #EFECEC;
            --accent: #ffd54a;
            --accent-glow: rgba(255, 213, 74, 0.25);
            --radius: 14px;
            --max-width: 1200px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cinzel Decorative", serif;
            background: radial-gradient(circle at 20% 20%, #000000, var(--bg) 90%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* ===== Container principal ===== */
        .wrap {
            max-width: var(--max-width);
            width: 100%;
            background: rgba(255, 1, 1, 0.55);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border-radius: var(--radius);
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== Header ===== */
        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        header h1 {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #3c0147 30%, var(--accent) 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 0.35rem;
        }

        header p {
            font-size: clamp(0.9rem, 1.4vw, 1.2rem);
            opacity: 0.8;
            letter-spacing: 0.04em;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.6rem;
            display: inline-block;
        }

        /* ===== Hero (destaque principal) ===== */
        .hero {
            margin-top: 0.5rem;
            margin-bottom: 2.2rem;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            cursor: pointer;
            background: var(--card);
        }

        .hero:hover {
            border-color: var(--accent);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
        }

        .hero img {
            display: block;
            width: 100%;
            height: clamp(280px, 45vw, 520px);
            object-fit: cover;
            transition: var(--transition);
        }

        .hero figcaption {
            padding: 0.9rem 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero figcaption span {
            opacity: 0.7;
            font-size: 0.8rem;
        }

        /* ===== Galeria ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.2rem;
            margin-top: 0.5rem;
        }

        .thumb {
            background: var(--card);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .thumb::after {
            content: "🔍";
            position: absolute;
            bottom: 8px;
            right: 10px;
            font-size: 1.2rem;
            opacity: 0;
            transition: var(--transition);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thumb:hover::after {
            opacity: 1;
        }

        .thumb:hover {
            transform: scale(1.03) translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), 0 0 18px var(--accent-glow);
        }

        .thumb img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            transition: var(--transition);
        }

        .thumb:hover img {
            transform: scale(1.02);
        }

        .thumb figcaption {
            padding: 0.7rem 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== Lightbox (modal) ===== */
        .lightbox {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.open {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 80vw;
            max-height: 85vh;
            border-radius: var(--radius);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 213, 74, 0.2);
            background: #0c1130;
            overflow: hidden;
            position: relative;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.92);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-content img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
        }

        .lightbox-content .lb-caption {
            padding: 0.8rem 1.5rem;
            background: rgba(70, 1, 57, 0.6);
            backdrop-filter: blur(4px);
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 18px;
            background: rgba(71, 1, 64, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 300;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
            line-height: 1;
            box-shadow: 0 4px 12px rgba(57, 0, 64, 0.5);
        }

        .lightbox-close:hover {
            background: var(--accent);
            color: #3a004c;
            transform: rotate(90deg);
            border-color: var(--accent);
        }

        /* ===== Rodapé ===== */
        .footer-note {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.35;
            letter-spacing: 0.1em;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.2rem;
        }

        .footer-note a {
            color: var(--accent);
            text-decoration: none;
            opacity: 0.6;
            transition: var(--transition);
        }

        .footer-note a:hover {
            opacity: 1;
        }

        /* ===== Responsividade extra ===== */
        @media (max-width: 640px) {
            .wrap {
                padding: 1.2rem 0.8rem;
            }
            .thumb img {
                height: 120px;
            }
            .lightbox-content {
                max-width: 96vw;
            }
            .lightbox-close {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
                top: 6px;
                right: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="wrap" role="main">

        <!-- ========== CABEÇALHO ========== -->
        <header>
            <h1>🏁 Melhores Carros</h1>
            <p>Seleção de elite · clique para ampliar</p>
        </header>

        <!-- ========== HERO (imagem principal) ========== -->
        <figure class="hero" id="heroFigure" role="button" tabindex="0" aria-label="Abrir imagem em destaque na lightbox">
            <img id="heroImage" src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=1200&q=80" alt="Carro esportivo vermelho em destaque" loading="eager">
            <figcaption>
                <span>⚡ Destaque da semana</span>
                <span>Ferrari F8 Tributo</span>
            </figcaption>
        </figure>

        <!-- ========== GALERIA ========== -->
        <div class="gallery" id="gallery">
            <!-- Os dados serão injetados via JavaScript (imagens de alta qualidade) -->
        </div>

        <!-- ========== RODAPÉ ========== -->
        <div class="footer-note">
            <span>© 2026 · Galeria Profissional</span>
        </div>

    </div>

    <!-- ========== LIGHTBOX ========== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Lightbox de imagens">
        <div class="lightbox-content">
            <button class="lightbox-close" id="closeLightbox" aria-label="Fechar lightbox">✕</button>
            <img id="lightboxImg" src="" alt="Imagem ampliada">
            <div class="lb-caption" id="lightboxCaption">Carro</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== CONJUNTO DE IMAGENS (high-end) =====
            const carros = [{
                url: 'https://miamiimports.com.br/wp-content/uploads/2024/04/911-carrera-s-23.jpg',
                nome: 'Porsche 911 Carrera S'
            }, {
                url: 'https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=800&q=80',
                nome: 'BMW Série 3'
            }, {
                url: 'https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800&q=80',
                nome: 'Mercedes AMG GT-R Pro'
            }, {
                url: 'https://images.unsplash.com/photo-1580274455191-1c62238fa333?w=800&q=80',
                nome: 'Porsche GT3 RS'
            }];

            // ===== REFERÊNCIAS =====
            const galleryEl = document.getElementById('gallery');
            const heroImg = document.getElementById('heroImage');
            const heroFig = document.getElementById('heroFigure');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const closeBtn = document.getElementById('closeLightbox');

            // ===== FUNÇÃO PARA ABRIR LIGHTBOX =====
            function openLightbox(src, alt, caption) {
                lightboxImg.src = src;
                lightboxImg.alt = alt || 'Imagem ampliada';
                lightboxCaption.textContent = caption || 'Carro';
                lightbox.classList.add('open');
                document.body.style.overflow = 'hidden';
                // Foco no botão de fechar para acessibilidade
                setTimeout(() => closeBtn.focus(), 50);
            }

            function closeLightbox() {
                lightbox.classList.remove('open');
                document.body.style.overflow = '';
                // Devolve foco ao elemento que abriu (se possível)
                const active = document.activeElement;
                if (active && active.closest('.thumb, .hero')) {
                    // mantém
                } else {
                    document.querySelector('.hero')?.focus();
                }
            }

            // ===== FECHAR COM ESC =====
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('open')) {
                    closeLightbox();
                }
            });

            // ===== CLICK NO OVERLAY (fechar) =====
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // ===== BOTÃO FECHAR =====
            closeBtn.addEventListener('click', closeLightbox);

            // ===== CONSTRUIR GALERIA =====
            function buildGallery() {
                galleryEl.innerHTML = '';
                carros.forEach((carro, index) => {
                    const figure = document.createElement('figure');
                    figure.className = 'thumb';
                    figure.setAttribute('role', 'button');
                    figure.setAttribute('tabindex', '0');
                    figure.setAttribute('aria-label', `Abrir imagem de ${carro.nome}`);

                    const img = document.createElement('img');
                    img.src = carro.url;
                    img.alt = carro.nome;
                    img.loading = 'lazy';
                    img.width = 300;
                    img.height = 200;

                    const figcaption = document.createElement('figcaption');
                    figcaption.textContent = carro.nome;

                    figure.appendChild(img);
                    figure.appendChild(figcaption);
                    galleryEl.appendChild(figure);

                    // Evento de clique no thumb
                    figure.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openLightbox(carro.url, carro.nome, carro.nome);
                    });

                    // Tecla Enter / Espaço
                    figure.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            openLightbox(carro.url, carro.nome, carro.nome);
                        }
                    });
                });
            }

            // ===== HERO: clicar abre lightbox com a imagem principal =====
            function setupHero() {
                const heroSrc = heroImg.getAttribute('src');
                const heroAlt = heroImg.getAttribute('alt') || 'Carro em destaque';
                const heroCaption = document.querySelector('.hero figcaption span:last-child')?.textContent || 'Destaque';

                heroFig.addEventListener('click', () => {
                    openLightbox(heroSrc, heroAlt, heroCaption);
                });

                heroFig.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openLightbox(heroSrc, heroAlt, heroCaption);
                    }
                });
            }

            // ===== INICIALIZAR =====
            buildGallery();
            setupHero();

            // ===== GARANTIR QUE A PRIMEIRA IMAGEM DA GALERIA NÃO SEJA IGUAL À HERO (evitar duplicidade) =====
            // (já estão diferentes)

            // ===== FECHAR LIGHTBOX COM CLICK FORA DO CONTEÚDO (já implementado) =====

            console.log('🏎️ Galeria profissional carregada com sucesso!');
        })();
    </script>

</body>
</html>
